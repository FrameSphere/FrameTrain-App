[package]
name = "frametrain-desktop"
version = "1.2.44"
description = "FrameTrain Desktop App"
authors = ["FrameTrain Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
dotenvy = "0.15"

tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

rusqlite = { version = "0.30", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
rand = "0.8"
dirs = "5.0"

reqwest = { version = "0.11", features = ["json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }

urlencoding = "2.1"

# Sichere Ablage von API-Keys im OS-Schluesselbund (macOS Keychain / Windows Credential Manager).
# Native Backends fuer die tatsaechlich ausgelieferten Plattformen.
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[features]
default = []
