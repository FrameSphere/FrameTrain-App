[package]
name = "frametrain-desktop"
version = "1.5.0"
description = "FrameTrain Desktop App"
authors = ["FrameTrain Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "macos-private-api"] }
dotenvy = "0.15"

tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Hosting: Tastenkuerzel fuer den Schnell-Chat, systemweit.
tauri-plugin-global-shortcut = "~2.3"
# Hosting: lokale HTTP-API (klein, synchron, ohne eigenen Async-Stack).
tiny_http = "0.12"
base64 = "0.22"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

rusqlite = { version = "0.30", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
rand = "0.8"
dirs = "5.0"

reqwest = { version = "0.11", features = ["json", "stream"] }
futures-util = "0.3"
bytes = "1"
tokio = { version = "1", features = ["full"] }

urlencoding = "2.1"

# Inhaltsadressierte Ablage im Dataset Studio: gleiches Bild = gleicher Pfad.
# Bereits als transitive Abhaengigkeit im Lockfile, kostet keinen neuen Download.
sha2 = "0.10"

# Sichere Ablage von API-Keys im OS-Schluesselbund (macOS Keychain / Windows Credential Manager).
# Native Backends fuer die tatsaechlich ausgelieferten Plattformen.
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[features]
default = []

[target.'cfg(target_os = "macos")'.dependencies]
# Nur fuer secret_exists: Attribute abfragen, ohne das Geheimnis zu lesen.
security-framework = "3"

[target.'cfg(target_os = "windows")'.dependencies]
# Hosting: Doppeltipp-Erkennung (GetAsyncKeyState).
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Hosting: Doppeltipp-Erkennung unter X11 (laedt libX11 zur Laufzeit, kein Build-Zwang).
x11-dl = "2"
